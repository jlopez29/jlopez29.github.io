  <style>
    html, body {
      background: #0B1320;
      color: #ffffff;
      height: 100%;
      margin: 0;
    }

    app-root {
      display: block;
      opacity: 0;
      transition: opacity 0.5s 0.2s ease-in-out; /* Delay fade-in slightly */
      pointer-events: none;
    }

    @keyframes rotate {
      100% {
        transform: rotate(1turn);
      }
    }
    .animate-rotate {
      animation: rotate 4s linear infinite;
    }
    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
    .animate-shimmer {
      position: relative;
      overflow: hidden;
    }
    .animate-shimmer::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.05) 20%, rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0));
      animation: shimmer 1.5s infinite;
    }
    @keyframes slide-in-fade {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-slide-in-fade {
      animation: slide-in-fade 0.3s ease-out forwards;
    }
    
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-in-out forwards;
    }
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-up {
      opacity: 0; /* Start hidden to prevent flash of unstyled content */
      animation: fade-in-up 0.5s ease-out forwards;
    }
    @keyframes slide-in-right-fade {
      from {
        opacity: 0;
        transform: translateX(25px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .animate-slide-in-right-fade {
      opacity: 0; /* Start hidden to prevent flash of unstyled content */
      animation: slide-in-right-fade 0.5s ease-out forwards;
    }

    /* --- View Transition Customization --- */

    /* This is the top-level overlay for the entire transition.
       Giving it a background color is the most robust way to prevent
       any "white flash" on mobile as the underlying DOM updates. */
    ::view-transition {
      background-color: #0B1320;
    }

    /* This pseudo-element animates the size and position of the view. */
    ::view-transition-group(*) {
      animation-duration: 0.5s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* These pseudo-elements handle the cross-fade (opacity).
       We keep their duration in sync with the group animation for a smoother feel. */
    ::view-transition-old(*),
    ::view-transition-new(*) {
      animation-duration: 0.5s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- Slower transition specifically for login on the home page --- */
    ::view-transition-group(home-content) {
      animation-duration: 1s;
    }
    ::view-transition-old(home-content),
    ::view-transition-new(home-content) {
      animation-duration: 1s;
    }
  </style>
