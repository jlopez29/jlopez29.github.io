<div class="fixed top-20 right-4 w-full max-w-sm z-[99999] space-y-3" style="view-transition-name: achievement-toast">
  @for (achievement of achievements(); track achievement.id) {
    <div 
      class="bg-gray-800 border border-cyan-500 rounded-xl shadow-2xl p-4 flex items-start gap-4 animate-slide-in-right-fade"
      role="alert" 
      aria-live="assertive">
      
      <div class="w-12 h-12 bg-gray-900 rounded-lg p-2 flex-shrink-0" [innerHTML]="achievement.iconSvg | safeHtml">
        <!-- SVG icon is rendered here -->
      </div>
      
      <div class="flex-grow">
        <p class="font-bold text-cyan-400">Achievement Unlocked!</p>
        <p class="text-white font-semibold">{{ achievement.name }}</p>
        <p class="text-sm text-gray-300 mt-1">{{ achievement.description }}</p>
      </div>

      <button (click)="dismissToast(achievement.id)" class="p-1.5 text-gray-400 hover:text-white rounded-full hover:bg-gray-700 transition-colors flex-shrink-0" aria-label="Dismiss">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
