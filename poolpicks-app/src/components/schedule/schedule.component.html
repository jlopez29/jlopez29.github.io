<div class="bg-gray-800 rounded-2xl shadow-lg p-6 sm:p-8">
  <h2 class="text-2xl sm:text-3xl font-bold text-cyan-400 mb-6 border-b-2 border-gray-700 pb-3">
    Week's Schedule
  </h2>
  <div class="flex flex-col gap-4 pr-2">
    @if (gameService.isLoading()) {
      <!-- Skeleton Loader for Game Cards -->
      @for (_ of [0, 1, 2, 3, 4]; track _) {
        <div class="bg-gray-700/50 p-4 rounded-xl flex items-center justify-between shadow-md h-24 animate-shimmer">
        </div>
      }
    } @else {
      @for (game of gameService.games(); track game.id; let i = $index) {
        <div class="animate-fade-in-up" [style.animation-delay]="i * 75 + 'ms'">
          <app-game-card [game]="game"></app-game-card>
        </div>
      } @empty {
        <p class="text-gray-400 text-center py-8 animate-fade-in">
          No games found for this week, or the schedule could not be loaded.
        </p>
      }
    }
  </div>
</div>
