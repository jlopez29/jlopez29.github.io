<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Neon House: a playable casino tycoon prototype. Build and staff your casino, walk the floor, and play craps at your own tables.">
  <meta name="theme-color" content="#0b121d">
  <title>Neon House — Casino Tycoon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b121d; color: #dbe5ed; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { min-height: 46px; display: flex; align-items: center; gap: 20px; padding: 8px 18px; border-bottom: 1px solid #293847; }
    a { color: #e3bb70; text-decoration: none; }
    .name { font-weight: 600; letter-spacing: 2px; }
    .hint { margin-left: auto; color: #8195a9; font-size: 12px; }
    button { color: #dbe5ed; background: #233747; border: 1px solid #3c5360; border-radius: 5px; padding: 6px 12px; cursor: pointer; }
    main { flex: 1; min-height: 0; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #mobile-note { display: none; padding: 9px 18px; background: #243342; font-size: 12px; }
    @media(max-width: 900px) { .hint { display: none; } #mobile-note { display: block; } header { gap: 12px; font-size: 12px; } }
  </style>
</head>
<body>
  <header>
    <a href="../" aria-label="Back to Jesse Lopez's portfolio">← Portfolio</a>
    <span class="name">NEON HOUSE <small>0.1</small></span>
    <span class="hint">Godot · fictional money · saves stay in this browser</span>
    <button id="fullscreen" type="button">Fullscreen</button>
  </header>
  <div id="mobile-note">Designed for a desktop keyboard and mouse. Rotate to landscape for a larger view.</div>
  <main id="game-container">
    <iframe src="game.html" title="Neon House casino tycoon game" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </main>
  <script>
    document.getElementById('fullscreen').addEventListener('click', async () => {
      const container = document.getElementById('game-container');
      try {
        if (!document.fullscreenElement) await container.requestFullscreen();
        else await document.exitFullscreen();
      } catch {
        document.getElementById('fullscreen').textContent = 'Fullscreen unavailable';
      }
    });
  </script>
</body>
</html>
